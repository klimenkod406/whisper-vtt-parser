[package]
name = "whisper-vtt-parser"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
description = "Parse both WebVTT and stdout-progress output formats of whisper.cpp into timed transcription segments."
license = "MIT"
readme = "README.md"
repository = "https://github.com/klimenkod406/whisper-vtt-parser"
keywords = ["whisper", "whisper.cpp", "vtt", "subtitles", "transcription", "asr"]
categories = ["text-processing", "multimedia::audio"]

[dependencies]
serde = { version = "1", features = ["derive"] }

[[example]]
name = "demo"
path = "examples/demo.rs"
